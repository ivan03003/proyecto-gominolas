<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de usuarios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet" href="estilo.css">
</head>
<body>
    <div class="login-card">
        <h2>Crear cuenta</h2>
        <form id="registroForm">
            <div class="mb-3">
                <label for="nombre" class="form-label">
                    Nombre
                </label>
                <input type="text"
                       class="form-control"
                       id="nombre"
                       required>
            </div>
            <!-- Apellido Paterno -->
            <div class="mb-3">
                <label for="apellidoP" class="form-label">
                    Apellido Paterno
                </label>
                <input type="text"
                       class="form-control"
                       id="apellidoP"
                       required>
            </div>
            <div class="mb-3">
                <label for="apellidoM" class="form-label">
                    Apellido Materno
                </label>
                <input type="text"
                       class="form-control"
                       id="apellidoM"
                       required>
            </div>
            <!-- Numero de control -->
            <div class="mb-3">
                <label for="control" class="form-label">
                    Número de control
                </label>
                <input type="text"
                       class="form-control"
                       id="control"
                       required>
            </div>
            <div class="mb-3">
                  <label for="inputSemestre" class="form-label">Semestre</label>
                  <select id="Semestre" class="form-control">
                 <option selected>Semestre...</option>
                 <option>1</option>
                 <option>2</option>
                 <option>3</option>
                 <option>4</option>
                 <option>5</option>
                 <option>6</option>
                 </select>
                 </div>

            <div class="mb-3">
                  <label for="inputTurno" class="form-label">Turno</label>
                  <select id="Turno" class="form-control">
                 <option selected>Turno...</option>
                 <option>Matutino</option>
                 <option>Vespertino</option>
                   </select>
                   </div>

            <div class="mb-3">
                 <label for="inputEspecialidad" class="form-label">Especialidad</label>
                 <select id="Especialidad" class="form-control">
                 <option selected>Especialidad...</option>
                 <option>Programación</option>
                 <option>Ventas</option>
                <option>Alimentos y bebidas</option>
                <option>Gestion Turistica</option>
                <option>Robotica</option>
                </select>
                </div>


            <!-- Contraseña -->
            <div class="mb-3">
                <label for="password" class="form-label">
                    Contraseña
                </label>
                <input type="password"
                       class="form-control"
                       id="password"
                       minlength="8"
                       required>
            </div>

            <!-- Confirmar contraseña -->
            <div class="mb-3">
                <label for="confirmar" class="form-label">
                    Confirmar contraseña
                </label>
                <input type="password"
                       class="form-control"
                       id="confirmar"
                       minlength="8"
                       required>
            </div>

            <button type="submit"
                    class="btn btn-success btn-login">
                Registrarse
            </button>
        </form>

        <div class="text-center mt-3">
            <a href="login.html">
                ¿Ya tienes cuenta? Inicia sesión
            </a>
        </div>
    </div>

    <script src="registro.js"></script>
</body>
</html>
